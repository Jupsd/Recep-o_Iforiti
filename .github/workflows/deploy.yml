name: Deploy PWA no GitHub Pages (Custo Zero)

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Definir base path automático do GitHub Pages
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            echo "VITE_BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE_PATH=/${REPO_NAME}/" >> "$GITHUB_ENV"
          fi

      - name: Compilar aplicação e gerar PWA
        env:
          VITE_SUPABASE_URL: 'https://bqlfwuckswlurnpgvcfb.supabase.co'
          VITE_SUPABASE_ANON_KEY: 'sb_publishable_3hDqxSuIHbYHexvDCzqs7Q_4wX_LolZ'
        run: |
          npm run build
          cp dist/index.html dist/404.html
          cp abrir-local.html dist/abrir-local.html
          mkdir -p dist/public
          cp public/logo.png dist/public/logo.png

      - name: Enviar artefato para o GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

