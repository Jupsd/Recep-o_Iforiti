        function render() {
          var app = document.getElementById('app');
          var db = getActiveDb();
          var auth = getAuth();
          var r = state.route;

          // Proteção de rotas
          if (r === '/painel' && !auth) {
            state.route = '/login';
            r = '/login';
          }
          if (r.indexOf('/admin') === 0) {
            if (!auth) {
              state.route = '/login';
              r = '/login';
            } else if (auth.papel !== 'ADMIN') {
              setFlash('err', 'Acesso restrito a Administradores.');
              state.route = '/painel';
              r = '/painel';
            }
          }

          var bodyHtml = '';
          if (r === '/senha') bodyHtml = renderSenha(db);
          else if (r === '/login') bodyHtml = renderLogin();
          else if (r === '/painel') bodyHtml = renderPainel(db, auth);
          else if (r === '/admin/gira') bodyHtml = renderAdminGira(db);
          else if (r === '/admin/cadastros') bodyHtml = renderAdminCadastros(db);
          else if (r === '/admin/relatorios') bodyHtml = renderAdminRelatorios(db);
          else bodyHtml = renderCheckin(db);

          app.innerHTML =
            renderTopbar(auth) +
            '<main style="flex:1;display:flex;flex-direction:column;">' +
            bodyHtml +
            '</main>' +
            '<footer>' +
            esc(TERREIRO_NOME) +
            ' • ' +
            esc(TERREIRO_SUB) +
            ' — Sistema de Gestão de Senhas e Atendimentos (Custo Zero)</footer>';

          bindEvents(db, auth);
        }

        // ============================================================
        // EVENTOS DOM APÓS RENDER
        // ============================================================
        function bindEvents(db, auth) {
          document.querySelectorAll('[data-nav]').forEach(function (el) {
            el.addEventListener('click', function () {
              state.flash = null;
              navigate(el.getAttribute('data-nav'));
            });
          });

          var btnFlash = document.getElementById('btn-close-flash');
          if (btnFlash) {
            btnFlash.addEventListener('click', function () {
              state.flash = null;
              render();
            });
          }

          var btnInstall = document.getElementById('btn-install-pwa');
          if (btnInstall && state.deferredPrompt) {
            btnInstall.addEventListener('click', function () {
              var p = state.deferredPrompt;
              state.deferredPrompt = null;
              p.prompt();
              render();
            });
          }

          var btnLogout = document.getElementById('btn-logout');
          if (btnLogout) {
            btnLogout.addEventListener('click', function () {
              setAuth(null);
              navigate('#/');
            });
          }

          // Check-in
          document.querySelectorAll('[data-select-escala]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              state.selectedEscalaId = btn.getAttribute('data-select-escala');
              render();
              var card = document.getElementById('checkin-form-card');
              if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            });
          });

          var inpTel = document.getElementById('inp-tel');
          if (inpTel) {
            inpTel.addEventListener('input', function () {
              inpTel.value = formatPhone(inpTel.value);
            });
          }

          var formCheckin = document.getElementById('form-checkin');
          if (formCheckin) {
            formCheckin.addEventListener('submit', function (ev) {
              ev.preventDefault();
              var nome = document.getElementById('inp-nome').value;
              var tel = document.getElementById('inp-tel').value;
              emitirSenhaPublica(state.selectedEscalaId, nome, tel);
            });
          }

          // Senha
          document.querySelectorAll('[data-pick-comp]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              setActiveComprovanteId(btn.getAttribute('data-pick-comp'));
              render();
            });
          });

          var btnSound = document.getElementById('btn-toggle-sound');
          if (btnSound) {
            btnSound.addEventListener('click', function () {
              state.soundEnabled = !state.soundEnabled;
              if (state.soundEnabled) playChime();
              render();
            });
          }

          var btnRefSenha = document.getElementById('btn-refresh-senha');
          if (btnRefSenha) {
            btnRefSenha.addEventListener('click', function () {
              if (isSupabaseActive()) syncSupabaseState(false);
              else render();
            });
          }

          // Login
          var formLogin = document.getElementById('form-login');
          if (formLogin) {
            formLogin.addEventListener('submit', async function (ev) {
              ev.preventDefault();
              var email = document.getElementById('login-email').value.trim().toLowerCase();
              var pass = document.getElementById('login-pass').value;
              if (isSupabaseActive()) {
                try {
                  var cfg = getSupabaseConfig();
                  var tok = await sbFetch('/auth/v1/token?grant_type=password', {
                    method: 'POST',
                    headers: {
                      apikey: cfg.anonKey,
                      'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email: email, password: pass }),
                  });
                  cfg.accessToken = tok.access_token;
                  localStorage.setItem(SUPABASE_RUNTIME_KEY, JSON.stringify(cfg));
                  var perfis = await sbFetch(
                    '/rest/v1/perfis_acesso?id=eq.' + tok.user.id + '&select=*',
                    { headers: sbHeaders(cfg, true) }
                  );
                  var p = perfis && perfis[0];
                  if (!p || !p.ativo) {
                    setFlash('err', 'Perfil não encontrado ou bloqueado.');
                    return render();
                  }
                  var papelNorm = p.perfil || p.papel;
                  setAuth({
                    id: p.id,
                    nome: p.nome,
                    email: p.email,
                    papel: papelNorm,
                  });
                  await syncSupabaseState(true);
                  navigate(papelNorm === 'ADMIN' ? '#/admin/gira' : '#/painel');
                } catch (err) {
                  setFlash('err', 'Falha no login Supabase: ' + err.message);
                  render();
                }
                return;
              }

              var ldb = getLocalDb();
              var user = (ldb.perfis_acesso || []).find(function (u) {
                return u.email.toLowerCase() === email && u.senha_demo === pass;
              });
              if (!user) {
                setFlash('err', 'E-mail ou senha inválidos.');
                return render();
              }
              if (!user.ativo) {
                setFlash('err', 'Usuário desativado pelo Administrador.');
                return render();
              }
              setAuth({
                id: user.id,
                nome: user.nome,
                email: user.email,
                papel: user.papel,
              });
              state.flash = null;
              navigate(user.papel === 'ADMIN' ? '#/admin/gira' : '#/painel');
            });
          }

          var formSb = document.getElementById('form-supabase-cfg');
          if (formSb) {
            formSb.addEventListener('submit', async function (ev) {
              ev.preventDefault();
              var u = normalizeSbUrl(document.getElementById('sb-url').value);
              var k = document.getElementById('sb-key').value.trim();
              if (!u || !k) {
                setFlash('err', 'Preencha URL e Anon Key do Supabase.');
                return render();
              }
              localStorage.setItem(
                SUPABASE_RUNTIME_KEY,
                JSON.stringify({ url: u, anonKey: k, accessToken: null })
              );
              setAuth(null);
              setFlash('ok', 'Configuração Supabase salva! Faça login com sua conta do Supabase.');
              await syncSupabaseState(true);
              render();
            });
          }

          var btnSbClear = document.getElementById('btn-sb-clear');
          if (btnSbClear) {
            btnSbClear.addEventListener('click', function () {
              localStorage.removeItem(SUPABASE_RUNTIME_KEY);
              state.supabaseCache = null;
              setAuth(null);
              setFlash('ok', 'Sistema alternado para Modo Local neste computador.');
              render();
            });
          }

          // Painel Cambono
          document.querySelectorAll('[data-filter-ent]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              state.filterEntidadeId = btn.getAttribute('data-filter-ent');
              render();
            });
          });

          var btnVoice = document.getElementById('btn-toggle-voice');
          if (btnVoice) {
            btnVoice.addEventListener('click', function () {
              state.voiceEnabled = !state.voiceEnabled;
              render();
            });
          }

          var btnHist = document.getElementById('btn-toggle-history');
          if (btnHist) {
            btnHist.addEventListener('click', function () {
              state.showHistory = !state.showHistory;
              render();
            });
          }

          document.querySelectorAll('[data-chamar]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              chamarAtendimento(btn.getAttribute('data-chamar'));
            });
          });

          document.querySelectorAll('[data-finalizar]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              finalizarAtendimento(btn.getAttribute('data-finalizar'));
            });
          });

          document.querySelectorAll('[data-ausente-open]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              state.ausenteTargetId = btn.getAttribute('data-ausente-open');
              render();
            });
          });

          var btnOpenMan = document.getElementById('btn-open-manual');
          if (btnOpenMan) {
            btnOpenMan.addEventListener('click', function () {
              state.manualModalOpen = true;
              render();
            });
          }
          var btnCloseMan = document.getElementById('btn-close-manual');
          if (btnCloseMan) {
            btnCloseMan.addEventListener('click', function () {
              state.manualModalOpen = false;
              render();
            });
          }
          var manTel = document.getElementById('man-tel');
          if (manTel) {
            manTel.addEventListener('input', function () {
              manTel.value = formatPhone(manTel.value);
            });
          }
          var formMan = document.getElementById('form-manual');
          if (formMan) {
            formMan.addEventListener('submit', function (ev) {
              ev.preventDefault();
              emitirSenhaManual(
                document.getElementById('man-escala').value,
                document.getElementById('man-nome').value,
                document.getElementById('man-tel').value
              );
            });
          }

          var btnAusMan = document.getElementById('btn-ausente-manter');
          if (btnAusMan) {
            btnAusMan.addEventListener('click', function () {
              confirmarAusencia(state.ausenteTargetId, false);
            });
          }
          var btnAusLib = document.getElementById('btn-ausente-liberar');
          if (btnAusLib) {
            btnAusLib.addEventListener('click', function () {
              confirmarAusencia(state.ausenteTargetId, true);
            });
          }
          var btnAusCan = document.getElementById('btn-ausente-cancel');
          if (btnAusCan) {
            btnAusCan.addEventListener('click', function () {
              state.ausenteTargetId = null;
              render();
            });
          }

          // Admin Gira
          document.querySelectorAll('.draft-field').forEach(function (el) {
            el.addEventListener('change', function () {
              var idx = Number(el.getAttribute('data-idx'));
              var field = el.getAttribute('data-field');
              if (state.draftEscalas[idx]) {
                state.draftEscalas[idx][field] =
                  field === 'limite_senhas' ? Number(el.value) || 1 : el.value;
              }
            });
          });

          document.querySelectorAll('[data-del-draft]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              var idx = Number(btn.getAttribute('data-del-draft'));
              state.draftEscalas.splice(idx, 1);
              render();
            });
          });

          var btnAddDraft = document.getElementById('btn-add-draft');
          if (btnAddDraft) {
            btnAddDraft.addEventListener('click', function () {
              var ents = db.entidades.filter(function (e) {
                return e.ativo;
              });
              var meds = db.equipe_espiritual.filter(function (m) {
                return m.ativo && m.funcao === 'MEDIUM';
              });
              var cams = db.equipe_espiritual.filter(function (m) {
                return m.ativo && m.funcao === 'CAMBONO';
              });
              var used = state.draftEscalas.map(function (r) {
                return r.entidade_id;
              });
              var nextEnt =
                ents.find(function (e) {
                  return used.indexOf(e.id) === -1;
                }) || ents[0];
              if (nextEnt && meds.length && cams.length) {
                state.draftEscalas.push({
                  entidade_id: nextEnt.id,
                  medium_id: meds[0].id,
                  cambono_id: cams[0].id,
                  limite_senhas: 15,
                });
                render();
              } else {
                setFlash('err', 'Cadastre Entidades, Médiuns e Cambonos ativos primeiro.');
                render();
              }
            });
          }

          var formAbrir = document.getElementById('form-abrir-gira');
          if (formAbrir) {
            formAbrir.addEventListener('submit', function (ev) {
              ev.preventDefault();
              abrirNovaGira(
                document.getElementById('gira-titulo').value,
                document.getElementById('gira-data').value,
                document.getElementById('gira-obs').value,
                state.draftEscalas
              );
            });
          }

          document.querySelectorAll('[data-lim-delta]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              ajustarLimiteEscala(
                btn.getAttribute('data-escala-id'),
                Number(btn.getAttribute('data-lim-delta'))
              );
            });
          });

          document.querySelectorAll('[data-toggle-pausa]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              togglePausaEscala(btn.getAttribute('data-toggle-pausa'));
            });
          });

          document.querySelectorAll('[data-del-escala]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              excluirEscalaDaGira(btn.getAttribute('data-del-escala'));
            });
          });

          var formAddEsc = document.getElementById('form-add-escala-aberta');
          if (formAddEsc) {
            formAddEsc.addEventListener('submit', function (ev) {
              ev.preventDefault();
              adicionarEscalaEmGiraAberta(
                document.getElementById('add-ent').value,
                document.getElementById('add-med').value,
                document.getElementById('add-cam').value,
                document.getElementById('add-lim').value
              );
            });
          }

          var btnEncerrar = document.getElementById('btn-encerrar-gira');
          if (btnEncerrar) {
            btnEncerrar.addEventListener('click', encerrarGiraAtual);
          }

          var inpQrUrl = document.getElementById('inp-qr-url');
          if (inpQrUrl) {
            inpQrUrl.addEventListener('change', function () {
              state.qrCustomUrl = inpQrUrl.value.trim();
              render();
            });
          }

          var btnPrint = document.getElementById('btn-print-poster');
          if (btnPrint) {
            btnPrint.addEventListener('click', function () {
              window.print();
            });
          }

          var btnDlQr = document.getElementById('btn-download-qr');
          if (btnDlQr) {
            btnDlQr.addEventListener('click', function () {
              var u = document.getElementById('inp-qr-url').value.trim();
              downloadQrPng(u, 'qrcode-recepcao-iforiti.png');
            });
          }

          var btnCopyQr = document.getElementById('btn-copy-qr-url');
          if (btnCopyQr) {
            btnCopyQr.addEventListener('click', function () {
              var u = document.getElementById('inp-qr-url').value.trim();
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(u).then(function () {
                  setFlash('ok', 'Link copiado para a área de transferência!');
                  render();
                });
              } else {
                window.prompt('Copie o link do check-in:', u);
              }
            });
          }

          // Admin Cadastros
          var formEnt = document.getElementById('form-new-ent');
          if (formEnt) {
            formEnt.addEventListener('submit', async function (ev) {
              ev.preventDefault();
              var nome = document.getElementById('new-ent-nome').value.trim();
              var desc = document.getElementById('new-ent-desc').value.trim();
              if (!nome) return;
              if (isSupabaseActive()) {
                try {
                  var cfg = getSupabaseConfig();
                  await sbFetch('/rest/v1/entidades', {
                    method: 'POST',
                    headers: sbHeaders(cfg, true),
                    body: JSON.stringify({ nome_entidade: nome, linha: desc || null, ativo: true }),
                  });
                  await syncSupabaseState(true);
                } catch (err) {
                  setFlash('err', err.message);
                  render();
                }
                return;
              }
              var ldb = getLocalDb();
              ldb.entidades.push({
                id: uid(),
                nome: nome,
                descricao: desc,
                ativo: true,
                criado_em: new Date().toISOString(),
              });
              saveLocalDb(ldb);
              setFlash('ok', 'Entidade cadastrada!');
              render();
            });
          }

          document.querySelectorAll('[data-toggle-ent]').forEach(function (btn) {
            btn.addEventListener('click', async function () {
              var id = btn.getAttribute('data-toggle-ent');
              if (isSupabaseActive()) {
                try {
                  var cur = db.entidades.find(function (e) {
                    return e.id === id;
                  });
                  var cfg = getSupabaseConfig();
                  await sbFetch('/rest/v1/entidades?id=eq.' + id, {
                    method: 'PATCH',
                    headers: sbHeaders(cfg, true),
                    body: JSON.stringify({ ativo: !cur.ativo }),
                  });
                  await syncSupabaseState(true);
                } catch (err) {
                  setFlash('err', err.message);
                  render();
                }
                return;
              }
              var ldb = getLocalDb();
              var item = ldb.entidades.find(function (e) {
                return e.id === id;
              });
              if (item) {
                item.ativo = !item.ativo;
                saveLocalDb(ldb);
                render();
              }
            });
          });

          var formEq = document.getElementById('form-new-eq');
          if (formEq) {
            formEq.addEventListener('submit', async function (ev) {
              ev.preventDefault();
              var nome = document.getElementById('new-eq-nome').value.trim();
              var funcao = document.getElementById('new-eq-func').value;
              if (!nome) return;
              if (isSupabaseActive()) {
                try {
                  var cfg = getSupabaseConfig();
                  await sbFetch('/rest/v1/equipe_espiritual', {
                    method: 'POST',
                    headers: sbHeaders(cfg, true),
                    body: JSON.stringify({ nome: nome, tipo: funcao, ativo: true }),
                  });
                  await syncSupabaseState(true);
                } catch (err) {
                  setFlash('err', err.message);
                  render();
                }
                return;
              }
              var ldb = getLocalDb();
              ldb.equipe_espiritual.push({
                id: uid(),
                nome: nome,
                funcao: funcao,
                ativo: true,
                criado_em: new Date().toISOString(),
              });
              saveLocalDb(ldb);
              setFlash('ok', 'Integrante cadastrado!');
              render();
            });
          }

          document.querySelectorAll('[data-toggle-eq]').forEach(function (btn) {
            btn.addEventListener('click', async function () {
              var id = btn.getAttribute('data-toggle-eq');
              if (isSupabaseActive()) {
                try {
                  var cur = db.equipe_espiritual.find(function (m) {
                    return m.id === id;
                  });
                  var cfg = getSupabaseConfig();
                  await sbFetch('/rest/v1/equipe_espiritual?id=eq.' + id, {
                    method: 'PATCH',
                    headers: sbHeaders(cfg, true),
                    body: JSON.stringify({ ativo: !cur.ativo }),
                  });
                  await syncSupabaseState(true);
                } catch (err) {
                  setFlash('err', err.message);
                  render();
                }
                return;
              }
              var ldb = getLocalDb();
              var item = ldb.equipe_espiritual.find(function (m) {
                return m.id === id;
              });
              if (item) {
                item.ativo = !item.ativo;
                saveLocalDb(ldb);
                render();
              }
            });
          });

          var formUsr = document.getElementById('form-new-usr');
          if (formUsr) {
            formUsr.addEventListener('submit', function (ev) {
              ev.preventDefault();
              var ldb = getLocalDb();
              var email = document.getElementById('usr-email').value.trim().toLowerCase();
              if (
                ldb.perfis_acesso.some(function (u) {
                  return u.email.toLowerCase() === email;
                })
              ) {
                setFlash('err', 'Já existe um usuário com este e-mail.');
                return render();
              }
              ldb.perfis_acesso.push({
                id: uid(),
                nome: document.getElementById('usr-nome').value.trim(),
                email: email,
                senha_demo: document.getElementById('usr-pass').value,
                papel: document.getElementById('usr-papel').value,
                ativo: true,
              });
              saveLocalDb(ldb);
              setFlash('ok', 'Usuário adicionado!');
              render();
            });
          }

          document.querySelectorAll('[data-toggle-usr]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              var id = btn.getAttribute('data-toggle-usr');
              var ldb = getLocalDb();
              var u = ldb.perfis_acesso.find(function (x) {
                return x.id === id;
              });
              if (u) {
                u.ativo = !u.ativo;
                saveLocalDb(ldb);
                render();
              }
            });
          });

          // Admin Relatórios
          var repGira = document.getElementById('rep-gira');
          if (repGira) {
            repGira.addEventListener('change', function () {
              state.reportFilters.gira_id = repGira.value;
              render();
            });
          }
          var repEnt = document.getElementById('rep-ent');
          if (repEnt) {
            repEnt.addEventListener('change', function () {
              state.reportFilters.entidade_id = repEnt.value;
              render();
            });
          }
          var repSt = document.getElementById('rep-status');
          if (repSt) {
            repSt.addEventListener('change', function () {
              state.reportFilters.status = repSt.value;
              render();
            });
          }
          var repBusca = document.getElementById('rep-busca');
          if (repBusca) {
            repBusca.addEventListener('input', function () {
              var pos = repBusca.selectionStart;
              state.reportFilters.busca = repBusca.value;
              render();
              var el = document.getElementById('rep-busca');
              if (el) {
                el.focus();
                try {
                  el.setSelectionRange(pos, pos);
                } catch (e) {}
              }
            });
          }
          var btnXls = document.getElementById('btn-exp-xls');
          if (btnXls) {
            btnXls.addEventListener('click', function () {
              exportReportExcel(getFilteredReportRows(db));
            });
          }
          var btnCsv = document.getElementById('btn-exp-csv');
          if (btnCsv) {
            btnCsv.addEventListener('click', function () {
              exportReportCsv(getFilteredReportRows(db));
            });
          }
        }

        // ============================================================
        // INICIALIZAÇÃO + PWA SERVICE WORKER + SINCRONIZAÇÃO CONTÍNUA
        // ============================================================
        if (
          (window.location.protocol === 'http:' || window.location.protocol === 'https:') &&
          'serviceWorker' in navigator
        ) {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('./sw.js').catch(function () {});
          });
        }
        window.addEventListener('beforeinstallprompt', function (ev) {
          ev.preventDefault();
          state.deferredPrompt = ev;
          render();
        });
        state.route = getRouteFromHash();
        if (isSupabaseActive()) {
          syncSupabaseState(true);
          setInterval(function () {
            if (isSupabaseActive()) syncSupabaseState(true);
          }, 3000);
        }
        render();
      })();
    </script>
  </body>
</html>
